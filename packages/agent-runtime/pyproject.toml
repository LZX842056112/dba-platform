[project]
name = "dba-runtime"
version = "0.1.0"
description = "可复用运行时内核（L2）：Pipeline / RunContext / 埋点装饰器 / Protocol 契约"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "opentelemetry-api>=1.28",
  "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dba_runtime"]

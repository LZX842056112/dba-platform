# ★ workspace 虚拟根（不含业务代码）。
# 只做两件事：声明 workspace 成员、集中 dev 工具依赖（PEP 735 dependency-groups）。
# 逐字对齐《设计文档 v2》§4.3 / 《实现要点清单》§7.1。
[project]
name = "dba-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
dba-runtime = { workspace = true }
dba         = { workspace = true }
dba-worker  = { workspace = true }

# PEP 735：dev 依赖集中在根，避免每个包各挑一套 lint/test 栈造成版本漂移
[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "anyio>=4.6",
  "ruff>=0.7",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "testcontainers[mysql,mongodb,redis]>=4.8",
  "respx>=0.21",
  "faker>=30.0",
  "fakeredis[lua]>=2.26",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# var/ 是运行时数据目录（DLQ 落盘 var/dlq/telemetry.jsonl，见 dba/config.py），
# 内含 QA 独立验证等临时脚本，非受管源码，不参与 lint（与 dist/build 同性质）。
# work/ 是评测输出目录（dba eval --out work/eval/*.json）。
extend-exclude = ["migrations/versions", "var", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "TID"]

# ★ 用 lint 强制分层红线：L3 模块之间禁止互相 import（红线 1）
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dba.modules.chatbi".msg = "L3 模块间禁止互相依赖，请走 L4 能力层或 trace_id"
"dba.modules.observability".msg = "L3 模块间禁止互相依赖，请走 L4 能力层或 trace_id"
"dba.modules.finops".msg = "L3 模块间禁止互相依赖，请走 L4 能力层或 trace_id"

[tool.ruff.lint.per-file-ignores]
# chatbi 包内部：允许模块内文件互相引用（含父级相对导入）。
# 说明：TID251 的红线是「L3 模块**之间**禁止互相依赖」，同一个模块内部的文件互相引用
# 不属于跨模块依赖。ruff 会把相对导入解析为绝对路径再判 TID251，故这里对 **chatbi 包自身**
# 一并放行 TID251（跨模块引用仍被拦截：其他模块 import dba.modules.chatbi.* 会命中）。
"apps/platform/src/dba/modules/chatbi/**" = ["TID251", "TID252"]
# 同理：observability / finops 包内部文件互相引用（包内相对导入）不属于跨模块依赖
"apps/platform/src/dba/modules/observability/**" = ["TID251", "TID252"]
"apps/platform/src/dba/modules/finops/**" = ["TID251", "TID252"]

# L1 接入/装配层：需要**静态** import L3 模块（红线 1 只禁止 L3 模块**之间**互相依赖；
# 由 L1 装配层统一 import 各模块是分层架构的应有之义）。其余模块仍被 TID251 拦截。
"apps/platform/src/dba/di.py" = ["TID251"]
"apps/platform/src/dba/api/**" = ["TID251"]
# 评测框架（L1 装配层）：驱动 L3 chatbi 流水线，与 di.py / api 同性质
"apps/platform/src/dba/evals/**" = ["TID251"]

# worker 是 L1 常驻进程（与 di.py 同为装配层）：定时任务需要驱动 L3 模块（observability.rollup
# 等）与 L5 存储；红线 1 禁止的是 L3 模块**之间**互相依赖，L1 装配层统一 import 属应有之义。
"apps/worker/**" = ["TID251"]

# 测试：需要**直接** import 被测的 L3 模块（chatbi）。红线 1 约束的是生产代码的分层，
# 测试作为验证方必须能触达被测对象，故放行 TID251。
"apps/platform/tests/**" = ["TID251"]
# 根 tests/（含 e2e）同理
"tests/**" = ["TID251"]


[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "apps"]
exclude = ["^migrations/", "/tests/", "^tests/", "/conftest\\.py$"]

[[tool.mypy.overrides]]
module = ["openai", "openai.*", "anthropic", "anthropic.*", "tiktoken", "tiktoken.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "sqlalchemy.*", "asyncmy", "asyncmy.*", "alembic", "alembic.*",
  "motor", "motor.*", "pymilvus", "pymilvus.*",
  "elasticsearch", "elasticsearch.*", "minio", "minio.*",
  "redis", "redis.*", "uvicorn", "uvicorn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

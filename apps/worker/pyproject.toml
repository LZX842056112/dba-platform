[project]
name = "dba-worker"
version = "0.1.0"
description = "常驻进程：定时采集 / 聚合 / 日报 / 归档"
requires-python = ">=3.12"
dependencies = ["dba", "apscheduler>=3.10"]

[project.scripts]
dba-worker = "dba_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dba_worker"]

[project]
name = "dba"
version = "0.1.0"
description = "数据大屏 × 多 Agent 平台（L1 接入 + L3 三模块 + L4 能力 + L5 存储适配）"
requires-python = ">=3.12"
dependencies = [
  "dba-runtime",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "sqlglot>=25.0",          # ★ 行级权限与方言校验的技术基础
  "pydantic-settings>=2.6",
  "orjson>=3.10",
  "structlog>=24.4",
  "tenacity>=9.0",
  "apscheduler>=3.10",
  "PyYAML>=6.0",              # 评测门槛文件 evals/thresholds.yaml
  "opentelemetry-api>=1.28",  # 由 dba-runtime 传递，显式声明以便 mypy 解析
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp>=1.28",
]

# 存储驱动做成可选 extras：本地开发不必拉起全部组件
[project.optional-dependencies]
mysql  = ["sqlalchemy[asyncio]>=2.0", "asyncmy>=0.2", "alembic>=1.14"]
mongo  = ["motor>=3.6"]
milvus = ["pymilvus>=2.4"]
# ★ ES 客户端主版本必须与服务器主版本一致：VM 上 Elasticsearch 为 8.11.3，
#   而 9.x 客户端会发 `compatible-with=9` 头，被 8.x 服务器拒绝（400）。
#   故此处**上界锁 <9**，避免 uv 解析到 9.x。
es     = ["elasticsearch[async]>=8.15,<9"]
minio  = ["minio>=7.2"]
redis  = ["redis[hiredis]>=5.2"]
llm    = ["openai>=1.50", "anthropic>=0.39", "tiktoken>=0.8"]
embedding-local = ["torch>=2.5", "sentence-transformers>=3.0"]
prod   = ["dba[mysql,mongo,milvus,es,minio,redis,llm,embedding-local]"]

[project.scripts]
dba = "dba.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dba"]
